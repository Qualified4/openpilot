name: Sync Upstream Branch

on:
  schedule:
    # 매시 정각(1시간마다) 실행
    - cron: '0 * * * *'
  # GitHub Actions 탭에서 수동 실행(Run workflow) 지원
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 내 저장소에 푸시하기 위한 쓰기 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync upstream branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync Qualified4/openpilot --source ajouatom/openpilot --branch carrot-wip

name: Sync Upstream

on:
  schedule:
    # 1시간마다 자동 실행
    - cron: '17 * * * *'
  # Actions 탭에서 수동 실행 버튼 지원
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream branch
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          gh repo sync Qualified4/openpilot --source ajouatom/openpilot --branch carrot-wip --force

[package]
name = "ccnc_visiond"
version = "0.1.0"
edition = "2021"
publish = false
description = "Camera vehicle detection process: wide side views at standstill, published as CcncVision"

[features]
# Both inference backends are built until one is chosen. CCNC_VISIOND_ENGINE picks one at run time.
default = ["ort", "tract"]
# onnxruntime, libonnxruntime.so loaded at run time (ORT_DYLIB_PATH).
ort = ["dep:ort"]
# Pure Rust.
tract = ["dep:tract-onnx", "dep:tract-linalg"]

[dependencies]
anyhow = "1"
ccnc_vision_msg = { path = "msg" }
libc = "0.2"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"], optional = true }
stripnet = { path = "../lane_type/rust", default-features = false, features = ["ipc"] }
tract-linalg = { version = "0.23.10", features = ["multithread-mm"], optional = true }
tract-onnx = { version = "0.23.10", default-features = false, optional = true }

[profile.release]
debug = false
lto = "thin"
codegen-units = 4
